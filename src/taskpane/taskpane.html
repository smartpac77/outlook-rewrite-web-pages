<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
  <title>Rewrite</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="taskpane.css?v=10" />
</head>
<body>
  <header>
    <h1>Rewrite</h1>
    <p class="subtitle">Rewrite your email into professional business language.</p>
  </header>

  <main>
    <section id="license-section" class="license-banner" hidden>
      <p id="license-message"></p>
      <div id="license-actions" class="license-actions">
        <button id="buy-license-button" class="secondary-button">Buy License ($1)</button>
        <div class="license-key-row">
          <input type="text" id="license-key-input" placeholder="Paste your license key" autocomplete="off" />
          <button id="activate-license-button" class="secondary-button">Activate</button>
        </div>
        <p id="license-status" class="status" role="status" aria-live="polite"></p>
      </div>
    </section>

    <section id="rewrite-section">
      <div id="rewrite-buttons"></div>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </section>

    <hr />

    <section id="settings-section">
      <h2>Settings</h2>

      <label for="provider-select">AI provider</label>
      <select id="provider-select">
        <option value="anthropic">Anthropic</option>
        <option value="openai">OpenAI</option>
        <option value="google">Google</option>
        <option value="grok">Grok (xAI)</option>
        <option value="meta">Meta (Llama API)</option>
      </select>

      <label for="model-input">Model</label>
      <input type="text" id="model-input" list="model-suggestions" />
      <datalist id="model-suggestions"></datalist>

      <label for="api-key-input">API key</label>
      <input type="password" id="api-key-input" placeholder="Your own API key — stored only on this device" autocomplete="off" />
      <p class="hint">Get a key from: <span id="api-key-url"></span></p>

      <h2 class="section-subheading">Languages</h2>

      <label for="language1-select">Language 1</label>
      <select id="language1-select"></select>

      <label for="language2-select">Language 2 (optional)</label>
      <select id="language2-select"></select>

      <label for="language3-select">Language 3 (optional)</label>
      <select id="language3-select"></select>

      <div class="add-language-row">
        <input type="text" id="custom-language-input" placeholder="Add a language not in the list" />
        <button id="add-language-button" class="secondary-button small-button">Add</button>
      </div>

      <button id="save-settings-button" class="primary-button">Save settings</button>
      <p id="settings-status" class="status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <script src="taskpane.js?v=10"></script>
</body>
</html>
